<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank you — Chaitnya Sharma</title>
  <meta name="description" content="Your message was sent. Chaitnya Sharma will reply within one working day.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://chaitnyasharma.in/thank-you.html">
  <link rel="icon" type="image/png" sizes="32x32" href="https://chaitnyasharma.in/favicon-32.png">
  <link rel="apple-touch-icon" href="https://chaitnyasharma.in/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b0c0e; --text:#ece8e1; --muted:#9a958c; --gold:#c4b08a; --line:#2a2d36; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      text-align: center;
    }
    main { max-width: 560px; }
    p.kicker {
      color: var(--gold);
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: 12px;
      margin-bottom: 18px;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.6rem, 7vw, 4.2rem);
      line-height: 1.05;
      margin-bottom: 18px;
    }
    p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 32px;
      background: var(--text);
      color: var(--bg);
      text-decoration: none;
      font-weight: 600;
      padding: 12px 18px;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Message received</p>
    <h1>Thank you.</h1>
    <p>Your note is in. I will reply within one working day.</p>
    <a href="index.html">Back to the site</a>
  </main>
</body>
